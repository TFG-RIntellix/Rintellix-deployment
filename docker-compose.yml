version: '3.8'

services:
  # ==========================================
  # DATABASES & MESSAGING
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: rintellix-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rintellix-private

  mongo-seed:
    image: mongo:7.0
    container_name: rintellix-mongo-seed
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./init-mongo:/init-mongo:ro
      - ./MongoDB:/dump:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
    command: /init-mongo/init-mongo.sh
    networks:
      - rintellix-private

  kafka:
    image: apache/kafka:3.8.1
    container_name: rintellix-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - rintellix-private

  # ==========================================
  # IDENTITY & SECURITY
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: rintellix-keycloak
    command:
      - start-dev
      - --import-realm
      - --http-port=8180
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8180"
    volumes:
      - ./Keycloak/import/rintellix-realm.json:/opt/keycloak/data/import/rintellix-realm.json:ro
      - ./Keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8180 && echo -e 'GET /realms/rintellix HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - rintellix-public
      - rintellix-private

  # ==========================================
  # MICROSERVICES
  # ==========================================
  ms-model:
    build:
      context: ./ms-model
    container_name: rintellix-ms-model
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - rintellix-private

  ms-core-data:
    build:
      context: ./ms-core-data
    container_name: rintellix-ms-core-data
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-seed:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      SPRING_MONGODB_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD_URI_ENCODED}@mongodb:27017/${MONGO_DB_NAME}?authSource=${MONGO_DB_NAME}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    volumes:
      - rintellix-reports:/app/reports
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - rintellix-private

  ms-risk-engine:
    build:
      context: ./ms-risk-engine
    container_name: rintellix-ms-risk-engine
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      ms-core-data:
        condition: service_healthy
      ms-model:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      RISK_MODEL_BASE_URL: ${MS_MODEL_BASE_URL}
      RISK_CORE_DATA_BASE_URL: ${MS_CORE_DATA_BASE_URL}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - rintellix-private

  ms-reporting:
    build:
      context: ./ms-reporting
    container_name: rintellix-ms-reporting
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      ms-core-data:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      MS_CORE_DATA_BASE_URL: ${MS_CORE_DATA_BASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      REPORT_PDF_OUTPUT_DIR: ${REPORT_PDF_OUTPUT_DIR}
    volumes:
      - rintellix-reports:/app/reports
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - rintellix-private

  ms-sec-gateway:
    build:
      context: ./ms-sec-gateway
    container_name: rintellix-ms-sec-gateway
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      MS_CORE_DATA_URI: ${MS_CORE_DATA_URI}
      MS_RISK_ENGINE_URI: ${MS_RISK_ENGINE_URI}
      SPRINGDOC_SWAGGER_UI_OAUTH_CLIENTID: rintellix-frontend
      SPRINGDOC_SWAGGER_UI_OAUTH_USE_PKCE_WITH_AUTHORIZATION_CODE_GRANT: "true"
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - rintellix-public
      - rintellix-private

  # ==========================================
  # FRONTEND
  # ==========================================
  ms-frontend:
    build:
      context: ./ms-frontend
    container_name: rintellix-frontend
    restart: unless-stopped
    depends_on:
      ms-sec-gateway:
        condition: service_healthy
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4200"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rintellix-public

networks:
  rintellix-public:
    driver: bridge
  rintellix-private:
    driver: bridge

volumes:
  mongo-data:
  rintellix-reports:
